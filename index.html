<html lang="zh">

<style>
/* ============ 基础与变量 ============ */
:root{
  --primary:#2c5f8a;
  --primary-dark:#1f4666;
  --accent:#e8a33d;
  --ink:#1f2933;
  --ink-2:#52606d;
  --ink-3:#7b8794;
  --bg:#ffffff;
  --bg-soft:#f5f7f9;
  --line:#e4e9ee;
  --shadow:0 8px 30px rgba(31,41,51,.08);
  --radius:14px;
  --maxw:1180px;
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  font-family:"Noto Sans SC","Helvetica Neue",Arial,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
  color:var(--ink);background:var(--bg);line-height:1.65;
}
img{max-width:100%;display:block}
a{color:inherit;text-decoration:none}
ul{list-style:none}
.container{max-width:var(--maxw);margin:0 auto;padding:0 24px}
h1,h2,h3{line-height:1.3}
.section{padding:72px 0}
.section-soft{background:var(--bg-soft)}
.section-title{font-size:30px;font-weight:700;margin-bottom:10px}
.section-sub{color:var(--ink-2);max-width:640px;margin-bottom:40px}
.center{text-align:center}

/* ============ 顶部导航 ============ */
header{
  position:sticky;top:0;z-index:50;background:rgba(255,255,255,.92);
  backdrop-filter:blur(10px);border-bottom:1px solid var(--line);
}
.nav{display:flex;align-items:center;justify-content:space-between;height:72px}
.logo{display:flex;align-items:center;gap:10px;font-weight:700;font-size:18px}
.logo-mark{
  width:38px;height:38px;border-radius:10px;background:var(--primary);
  display:flex;align-items:center;justify-content:center;color:#fff;flex:none;
}
.logo-mark svg{width:22px;height:22px}
.nav-links{display:flex;align-items:center;gap:28px}
.nav-links a{font-size:15px;color:var(--ink-2);padding:6px 0;position:relative}
.nav-links a.active,.nav-links a:hover{color:var(--primary)}
.nav-links a.active::after{
  content:"";position:absolute;left:0;right:0;bottom:-4px;height:2px;background:var(--primary);border-radius:2px;
}
.nav-actions{display:flex;align-items:center;gap:14px}
.lang-switch{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.lang-switch button{
  border:none;background:#fff;padding:6px 14px;font-size:13px;cursor:pointer;color:var(--ink-3);
}
.lang-switch button.on{background:var(--primary);color:#fff}
.btn{
  display:inline-flex;align-items:center;gap:8px;padding:11px 22px;border-radius:10px;
  background:var(--primary);color:#fff;font-size:15px;font-weight:500;border:1px solid var(--primary);
  cursor:pointer;transition:.2s;
}
.btn:hover{background:var(--primary-dark)}
.btn.ghost{background:#fff;color:var(--primary)}
.btn.ghost:hover{background:var(--bg-soft)}
.burger{display:none;background:none;border:none;cursor:pointer;padding:8px}
.burger span{display:block;width:22px;height:2px;background:var(--ink);margin:5px 0;border-radius:2px}

/* ============ Hero ============ */
.hero{padding:88px 0 72px;background:linear-gradient(180deg,#f5f7f9 0%,#fff 100%)}
.hero-grid{display:grid;grid-template-columns:1.1fr .9fr;gap:48px;align-items:center}
.hero h1{font-size:42px;font-weight:800;margin-bottom:20px}
.hero h1 em{font-style:normal;color:var(--primary)}
.hero p{color:var(--ink-2);font-size:17px;margin-bottom:30px;max-width:520px}
.hero-cta{display:flex;gap:14px;flex-wrap:wrap}
.hero-stats{display:flex;gap:36px;margin-top:44px;flex-wrap:wrap}
.stat b{font-size:28px;color:var(--primary);display:block}
.stat span{font-size:13px;color:var(--ink-3)}
.hero-visual{
  aspect-ratio:4/3;border-radius:var(--radius);background:var(--bg-soft);
  border:1px solid var(--line);position:relative;overflow:hidden;
}
.hero-visual svg{width:100%;height:100%}

/* ============ 卡片网格 ============ */
.grid-4{display:grid;grid-template-columns:repeat(4,1fr);gap:24px}
.grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:24px}
.card{
  background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:28px;
  transition:.2s;
}
.card:hover{box-shadow:var(--shadow);transform:translateY(-3px)}
.card .icon{
  width:48px;height:48px;border-radius:12px;background:#eef3f8;display:flex;align-items:center;
  justify-content:center;margin-bottom:18px;color:var(--primary);
}
.card .icon svg{width:26px;height:26px}
.card h3{font-size:17px;margin-bottom:10px}
.card p{color:var(--ink-2);font-size:14px}

/* ============ 产品 ============ */
.product-card{background:#fff;border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;transition:.2s;cursor:pointer}
.product-card:hover{box-shadow:var(--shadow)}
.product-thumb{aspect-ratio:4/3;background:var(--bg-soft);display:flex;align-items:center;justify-content:center;color:var(--primary)}
.product-thumb svg{width:64px;height:64px}
.product-body{padding:22px}
.product-body h3{font-size:17px;margin-bottom:8px}
.product-body p{color:var(--ink-2);font-size:14px;margin-bottom:14px}
.tag{display:inline-block;font-size:12px;color:var(--primary);background:#eef3f8;border-radius:6px;padding:3px 10px}

/* ============ 关于页 ============ */
.about-grid{display:grid;grid-template-columns:1fr 1fr;gap:48px;align-items:center}
.about-visual{aspect-ratio:4/3;border-radius:var(--radius);background:var(--bg-soft);border:1px solid var(--line);overflow:hidden}
.about-visual svg{width:100%;height:100%}
.feature-list li{display:flex;gap:14px;margin-bottom:18px}
.feature-list .dot{width:22px;height:22px;border-radius:50%;background:#eef3f8;color:var(--primary);display:flex;align-items:center;justify-content:center;flex:none;font-size:13px}
.timeline{margin-top:20px}
.timeline li{position:relative;padding-left:28px;padding-bottom:24px;border-left:2px solid var(--line)}
.timeline li:last-child{padding-bottom:0}
.timeline li::before{content:"";position:absolute;left:-7px;top:4px;width:12px;height:12px;border-radius:50%;background:var(--primary)}
.timeline b{display:block}
.timeline span{color:var(--ink-3);font-size:13px}

/* ============ 详情页 ============ */
.detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:40px}
.detail-visual{aspect-ratio:4/3;border-radius:var(--radius);background:var(--bg-soft);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;color:var(--primary)}
.detail-visual svg{width:120px;height:120px}
.spec-table{width:100%;border-collapse:collapse;margin-top:20px}
.spec-table th,.spec-table td{padding:13px 16px;border-bottom:1px solid var(--line);font-size:14px;text-align:left}
.spec-table th{color:var(--ink-3);font-weight:500;width:40%;background:var(--bg-soft)}
.breadcrumb{font-size:13px;color:var(--ink-3);margin-bottom:24px}
.breadcrumb a:hover{color:var(--primary)}

/* ============ 新闻 ============ */
.news-item{display:grid;grid-template-columns:160px 1fr;gap:24px;padding:26px 0;border-bottom:1px solid var(--line);cursor:pointer}
.news-item:last-child{border-bottom:none}
.news-thumb{aspect-ratio:4/3;border-radius:12px;background:var(--bg-soft);display:flex;align-items:center;justify-content:center;color:var(--primary)}
.news-thumb svg{width:40px;height:40px}
.news-meta{font-size:13px;color:var(--ink-3);margin-bottom:8px}
.news-item h3{font-size:18px;margin-bottom:8px}
.news-item p{color:var(--ink-2);font-size:14px}

/* ============ 联系 ============ */
.contact-grid{display:grid;grid-template-columns:1fr 1.2fr;gap:40px}
.contact-info li{display:flex;gap:14px;margin-bottom:22px}
.contact-info .icon{width:42px;height:42px;border-radius:12px;background:#eef3f8;color:var(--primary);display:flex;align-items:center;justify-content:center;flex:none}
.contact-info .icon svg{width:22px;height:22px}
.form-card{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:32px}
.form-row{margin-bottom:18px}
.form-row label{display:block;font-size:14px;margin-bottom:8px;color:var(--ink-2)}
.form-row input,.form-row textarea,.form-row select{
  width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:10px;font-size:15px;font-family:inherit;background:#fff;
}
.form-row input:focus,.form-row textarea:focus{outline:none;border-color:var(--primary)}
.form-row textarea{resize:vertical;min-height:110px}
.form-msg{margin-top:14px;font-size:14px;color:var(--primary)}

/* ============ CTA 条 / 页脚 ============ */
.cta-band{background:var(--primary);color:#fff;border-radius:var(--radius);padding:44px 40px;display:flex;align-items:center;justify-content:space-between;gap:24px;flex-wrap:wrap}
.cta-band h3{font-size:24px;margin-bottom:8px}
.cta-band p{opacity:.85}
.cta-band .btn{background:#fff;color:var(--primary);border-color:#fff}
footer{border-top:1px solid var(--line);padding:56px 0 28px;margin-top:72px;background:var(--bg-soft)}
.footer-grid{display:grid;grid-template-columns:1.4fr 1fr 1fr 1fr;gap:36px;margin-bottom:36px}
.footer-grid h4{font-size:15px;margin-bottom:16px}
.footer-grid li{margin-bottom:10px}
.footer-grid a{color:var(--ink-2);font-size:14px}
.footer-grid a:hover{color:var(--primary)}
.footer-bottom{border-top:1px solid var(--line);padding-top:24px;text-align:center;color:var(--ink-3);font-size:13px}

/* ============ 响应式 ============ */
@media(max-width:960px){
  .grid-4{grid-template-columns:repeat(2,1fr)}
  .grid-3{grid-template-columns:repeat(2,1fr)}
  .hero-grid,.about-grid,.detail-grid,.contact-grid{grid-template-columns:1fr}
  .footer-grid{grid-template-columns:1fr 1fr}
  .hero h1{font-size:32px}
}
@media(max-width:680px){
  .nav-links{
    position:fixed;inset:72px 0 auto 0;background:#fff;border-bottom:1px solid var(--line);
    flex-direction:column;padding:20px 24px;gap:18px;display:none;
  }
  .nav-links.open{display:flex}
  .burger{display:block}
  .grid-4,.grid-3{grid-template-columns:1fr}
  .news-item{grid-template-columns:1fr}
  .section{padding:52px 0}
}
</style>

/* ==================== 路由 ==================== */
function render(){
  const app = $("#app");
  const hash = location.hash.replace(/^#\//,"") || "home";
  const [route, param] = hash.split("/");

  let html = "";
  if(route==="about") html = viewAbout();
  else if(route==="products") html = viewProducts();
  else if(route==="product") html = viewDetail(param);
  else if(route==="news") html = viewNews();
  else if(route==="contact") html = viewContact();
  else html = viewHome();

  app.innerHTML = html;

  /* 导航高亮 */
  document.querySelectorAll(".nav-links a").forEach(a=>{
    a.classList.toggle("active", a.dataset.route===route || (route==="product"&&a.dataset.route==="products"));
  });
  $("#navLinks").classList.remove("open");

  /* 联系表单（演示） */
  const form = $("#contactForm");
  if(form){
    form.addEventListener("submit", e=>{
      e.preventDefault();
      $("#formMsg").textContent = t("form_success");
      form.reset();
    });
  }
  window.scrollTo({top:0,behavior:"smooth"});
}

/* ==================== 语言切换 ==================== */
function applyLang(){
  document.documentElement.lang = lang;
  document.title = lang==="zh" ? "精创精密五金 · 公司官网" : "Precision Metal Works — Official Site";
  document.querySelectorAll("[data-i18n]").forEach(el=>{
    const key = el.dataset.i18n;
    if(I18N[lang][key]) el.textContent = I18N[lang][key];
  });
  $("#langZh").classList.toggle("on", lang==="zh");
  $("#langEn").classList.toggle("on", lang==="en");
  /* 页脚产品类别 */
  $("#footerProducts").innerHTML = PRODUCTS.slice(0,4)
    .map(p=>`<li><a href="#/product/${p.id}">${pick(p.name)}</a></li>`).join("");
  render();
}

$("#langZh").addEventListener("click",()=>{lang="zh";localStorage.setItem("pmw_lang",lang);applyLang();});
$("#langEn").addEventListener("click",()=>{lang="en";localStorage.setItem("pmw_lang",lang);applyLang();});
$("#burger").addEventListener("click",()=>$("#navLinks").classList.toggle("open"));
window.addEventListener("hashchange",render);

applyLang();
